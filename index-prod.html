		<link rel="manifest" href="/manifest.json" />

		<title>Higgins GRÀFIC - Samarretes Premium | Col·leccions Exclusives</title>
	</head>
	<body>
		<div id="root">
			<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #ffffff; color: #141414; font-family: system-ui, -apple-system, sans-serif;">
				<div style="text-align: center;">
					<div style="width: 32px; height: 32px; border: 3px solid #f3f4f6; border-top-color: #141414; border-radius: 50%; animation: hg-spin 0.8s linear infinite; margin: 0 auto 16px auto;"></div>
					<div style="font-size: 13px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; color: #141414;">Higgins GRÀFIC</div>
				</div>
			</div>
			<style>
				@keyframes hg-spin { to { transform: rotate(360deg); } }
			</style>
		</div>
		<script>
			console.log('🌟 PROD — HTML loaded, waiting for React...');
			window.addEventListener('error', (e) => {
				const err = e && e.error;
				const details = err
					? {
						name: err && err.name,
						message: err && err.message,
						stack: err && err.stack,
						toString: (err && typeof err.toString === 'function') ? err.toString() : String(err),
						raw: err
					}
					: { message: e && e.message, filename: e && e.filename, lineno: e && e.lineno, colno: e && e.colno };
				console.error('💥 PROD — Global error:', details);
				if (window.__GRAFIC_REACT_MOUNTED__) {
					return;
				}
				const root = document.getElementById('root');
				if (root) {
					root.innerHTML = `
						<div style="min-height:100vh;background:#f9fafb;display:flex;align-items:center;justify-content:center;padding:16px;">
							<div style="max-width:560px;width:100%;background:white;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.1);padding:32px;text-align:center;">
								<div style="font-size:48px;line-height:1;margin-bottom:16px;color:#dc2626">✕</div>
								<h1 style="font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial; font-size:24px; font-weight:700; margin:0 0 12px; color:#111827">Error carregant l'aplicació</h1>
								<div style="background:#f3f4f6;border-radius:8px;padding:16px;text-align:left;">
									<div style="font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New'; font-size:12px; white-space:pre-wrap; color:#111827;">${(details && (details.name || details.message)) ? (String(details.name || '') + (details.message ? (': ' + details.message) : '')) : (e.message || 'Error desconegut')}</div>
									<div style="margin-top:10px; font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New'; font-size:12px; color:#374151;">File: ${e.filename || ''}</div>
									<div style="font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New'; font-size:12px; color:#374151;">Line: ${(e.lineno || '')} : ${(e.colno || '')}</div>
								</div>
								<div style="margin-top:16px;">
									<a href="#" onclick="location.reload();return false;" style="display:inline-block;padding:10px 14px;border-radius:8px;background:#111827;color:#fff;text-decoration:none;font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial;font-weight:600;">Recarregar</a>
								</div>
							</div>
						</div>
					`;
				}
			});
		</script>
		<script type="module" src="/src/main-prod.jsx"></script>
	</body>
</html>
