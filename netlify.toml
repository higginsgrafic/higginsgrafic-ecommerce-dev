[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/placeholders/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/custom_logos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/product_episodes/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/logo-*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
     Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: https://jnuuejlxuyqhhkfucuxg.supabase.co https://images.unsplash.com https://product.gelatoapis.com https://order.gelatoapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://jnuuejlxuyqhhkfucuxg.supabase.co https://product.gelatoapis.com https://order.gelatoapis.com https://*.ingest.sentry.io https://*.sentry.io https://plausible.io; media-src 'self'; worker-src blob:; script-src 'self' 'unsafe-inline' https://js.stripe.com https://plausible.io; frame-src https://js.stripe.com https://www.youtube.com;"

[[redirects]]
  from = "/video/*"
  to = "/video/:splat"
  status = 200

[[redirects]]
  from = "/admin/studio/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin-login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/ec-preview-lite"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/ec-preview-lite/*"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/ec-preview"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/ec-preview/*"
  to = "/index.html"
  status = 200
  force = true

 [[redirects]]
  from = "/layout-builder"
  to = "/index.html"
  status = 200

 [[redirects]]
  from = "/layout-builder/*"
  to = "/index.html"
  status = 200

 [[redirects]]
  from = "/proves/layout-builder"
  to = "/index.html"
  status = 200

 [[redirects]]
  from = "/proves/layout-builder/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/higginsgrafic.com/*"
  to = "/index.html"
  status = 200
