[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: https://jnuuejlxuyqhhkfucuxg.supabase.co https://images.unsplash.com https://product.gelatoapis.com https://order.gelatoapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://jnuuejlxuyqhhkfucuxg.supabase.co https://product.gelatoapis.com https://order.gelatoapis.com https://*.ingest.sentry.io https://*.sentry.io https://plausible.io; media-src 'self'; worker-src blob:; script-src 'self' 'unsafe-inline' https://js.stripe.com https://plausible.io; frame-src https://js.stripe.com https://www.youtube.com;"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

