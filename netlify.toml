[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Empaquetador de les funcions de servidor.
#
# PER QUÈ ESBULD I NO EL QUE HI HAVIA PER DEFECTE (nft)
#
# Amb l'empaquetador per defecte, els fitxers que una funció importa
# indirectament no arribaven al servidor i, sobretot, les plantilles de
# correu (.jsx) es copiaven SENSE transformar. Node no sap llegir JSX, així
# que el sistema de correu no podia funcionar mai.
#
# Esbuild sí que entén JSX i ho deixa tot en un sol fitxer per funció.
[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
