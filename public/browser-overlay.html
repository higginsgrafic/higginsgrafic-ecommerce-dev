<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overlay Navegador - Higgins</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --fons: #12121c; --fons2: #1a1a28; --fons3: #24243a;
    --vora: #33334d; --text: #e8e8f0; --text2: #9a9ab0; --accent: #ff0040;
    --rail: 46px;
  }
  body {
    background: var(--fons); color: var(--text);
    font-family: -apple-system, system-ui, sans-serif; font-size: 13px;
    height: 100vh; overflow: hidden;
    display: grid;
    grid-template-columns: var(--rail) 1fr;
    grid-template-rows: auto auto 1fr;
    grid-template-areas:
      "panell barra"
      "panell pestanyes"
      "panell tauler";
  }
  /* El panell plegat nomes fa --rail d'ample: l'acordio existeix precisament
     perque la llista de formats no ocupi pantalla. */
  body.panell-obert { grid-template-columns: 250px 1fr; }
  .panell {
    grid-area: panell; background: var(--fons2); border-right: 1px solid var(--vora);
    overflow: hidden auto; display: flex; flex-direction: column;
  }
  .panell .cap {
    display: flex; align-items: center; gap: 8px; padding: 10px 8px;
    border-bottom: 1px solid var(--vora); position: sticky; top: 0;
    background: var(--fons2); z-index: 2;
  }
  .panell .cap h1 { font-size: 13px; white-space: nowrap; }
  body:not(.panell-obert) .panell .cap h1,
  body:not(.panell-obert) .panell .grups { display: none; }
  .grups { padding-bottom: 30px; }
  .grup { border-bottom: 1px solid var(--vora); }
  .grup > button.capçalera {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: transparent; border: none; border-radius: 0; padding: 9px 10px; color: var(--text);
  }
  .grup > button.capçalera:hover { background: var(--fons3); }
  .grup > button.capçalera .fletxa { color: var(--text2); transition: transform .15s; }
  .grup.obert > button.capçalera .fletxa { transform: rotate(90deg); }
  .grup > button.capçalera .compta { margin-left: auto; color: var(--text2); font-size: 11px; }
  .grup .llista { display: none; padding: 2px 6px 8px; }
  .grup.obert .llista { display: block; }
  .opcio { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 5px; cursor: pointer; }
  .opcio:hover { background: var(--fons3); }
  .opcio input { accent-color: var(--accent); cursor: pointer; }
  .opcio .nom { flex: 1; }
  .opcio .mida { color: var(--text2); font-size: 11px; font-variant-numeric: tabular-nums; }
  .filtre { padding: 8px 10px; border-bottom: 1px solid var(--vora); display: flex; flex-direction: column; gap: 6px; }
  .filtre .fila { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .filtre .titol { color: var(--text2); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; width: 100%; }
  .filtre button { padding: 4px 8px; font-size: 11.5px; }
  .filtre .obre { background: var(--accent); border-color: var(--accent); color: #fff; }
  .filtre .obre:hover { background: #d4003a; }

  /* ── BARRA ─────────────────────────────────────────────────────── */
  .barra {
    grid-area: barra; display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
    padding: 8px 12px; background: var(--fons2); border-bottom: 1px solid var(--vora);
  }
  button, select, input[type="text"] {
    font-family: inherit; font-size: 12.5px; color: var(--text);
    background: var(--fons3); border: 1px solid var(--vora); border-radius: 6px;
    padding: 6px 10px; cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }
  button:hover:not(:disabled) { background: #2f2f4a; }
  button.actiu { background: var(--accent); border-color: var(--accent); color: #fff; }
  input[type="text"] { cursor: text; width: 140px; }
  .grup-control { display: flex; }
  .grup-control button { border-radius: 0; }
  .grup-control button:first-child { border-radius: 6px 0 0 6px; }
  .grup-control button:last-child { border-radius: 0 6px 6px 0; }
  .zoom-num { min-width: 60px; text-align: center; background: var(--fons3); border: 1px solid var(--vora); border-left: none; border-right: none; padding: 6px 4px; }
  .etiqueta-barra { color: var(--text2); font-size: 12px; }
  .ajuda { color: var(--text2); font-size: 11.5px; margin-left: auto; text-align: right; }
  label.amb-select { display: flex; align-items: center; gap: 6px; color: var(--text2); font-size: 12px; }
  label.amb-select select { padding: 5px 6px; }

  /* ── PESTANYES (una per format obert) ──────────────────────────── */
  .pestanyes {
    grid-area: pestanyes; display: flex; align-items: stretch; gap: 2px;
    padding: 0 8px; background: #10101a; border-bottom: 1px solid var(--vora);
    overflow-x: auto; overflow-y: hidden;
  }
  .pestanyes button.pestanya {
    display: flex; align-items: center; gap: 7px; background: transparent;
    border: none; border-bottom: 2px solid transparent; border-radius: 0;
    padding: 8px 10px; color: var(--text2); white-space: nowrap;
  }
  .pestanyes button.pestanya:hover { background: var(--fons3); color: var(--text); }
  .pestanyes button.pestanya.activa { color: #fff; border-bottom-color: var(--accent); }
  .pestanyes button.pestanya.principal { font-weight: 600; }
  .pestanyes button.pestanya.principal .mida { background: var(--fons3); border-radius: 9px; padding: 0 6px; }
  .pestanyes .pestanya .mida { font-size: 11px; color: var(--text2); font-variant-numeric: tabular-nums; }
  .pestanyes .pestanya .tanca { padding: 0 3px; border-radius: 3px; }
  .pestanyes .pestanya .tanca:hover { background: var(--accent); color: #fff; }
  .pestanyes .buit { color: var(--text2); padding: 8px 4px; font-size: 12px; }

  /* ── TAULER ────────────────────────────────────────────────────── */
  .tauler { grid-area: tauler; overflow: auto; position: relative; background: #0d0d14; }
  .llenç { position: absolute; top: 0; left: 0; }

  .marc { position: absolute; }
  .marc .escala { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  .marc .caixa { position: relative; background: #fff; box-shadow: 0 6px 30px rgba(0,0,0,.55); }
  .marc .finestra { position: absolute; top: 0; left: 0; border: none; background: #fff; }
  .marc .barra-navegador { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 10; }
  .marc .falsa-barra {
    position: absolute; left: 0; right: 0; z-index: 10; pointer-events: none;
    background: repeating-linear-gradient(135deg, #dcdce4, #dcdce4 6px, #cfcfda 6px, #cfcfda 12px);
    border-bottom: 1px solid #b9b9c6; display: flex; align-items: center; justify-content: center;
    color: #55555f; font-size: 10px; letter-spacing: .04em;
  }
  .marc .carregant {
    position: absolute; inset: 0; z-index: 12; display: flex; align-items: center; justify-content: center;
    background: #fff; color: #888; font-size: 13px;
  }
  .marc.carregat .carregant { display: none; }
  .marc .sens-visita {
    position: absolute; inset: 0; z-index: 12; display: flex; align-items: center; justify-content: center;
    background: #f4f4f7; color: #55555f; text-align: center;
  }
  .marc .sens-visita .contingut { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .marc .etiqueta {
    position: absolute; left: 0; bottom: 0; z-index: 14;
    display: flex; align-items: center; gap: 8px; white-space: nowrap; max-width: 100%;
    background: rgba(12, 12, 20, .84); color: #fff; padding: 3px 8px; border-radius: 0 5px 0 0;
  }
  .marc .etiqueta .nom { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .marc .etiqueta .mida { color: #b9b9cc; font-variant-numeric: tabular-nums; }
  .marc .etiqueta .estat { color: #b9b9cc; }
  .marc .etiqueta button { padding: 1px 6px; font-size: 11px; background: rgba(255,255,255,.14); border-color: transparent; color: #fff; }
  .marc .etiqueta button:hover { background: var(--accent); }
  .marc.actiu .caixa { outline: 2px solid var(--accent); }
  .etiqueta-grup {
    position: absolute; z-index: 14; color: #d8d8e8; font-size: 12px; letter-spacing: .08em;
    text-transform: uppercase; background: rgba(12, 12, 20, .88); padding: 2px 9px; border-radius: 5px;
  }
  .sense-res { position: absolute; top: 24px; left: 24px; color: var(--text2); font-size: 13px; max-width: 420px; line-height: 1.5; }
</style>
</head>
<body>

<div class="panell" id="panell">
  <div class="cap">
    <button id="plega" title="Plegar o desplegar la llista de formats">☰</button>
    <h1>Formats</h1>
  </div>
  <div class="grups" id="grups"></div>
</div>

<div class="barra">
  <span class="etiqueta-barra">Ruta:</span>
  <input type="text" id="ruta" title="Ruta de la pestanya activa">
  <div class="grup-control">
    <button id="zoom-menys" title="Allunyar la vista activa">−</button>
    <span class="zoom-num" id="zoom-num">100%</span>
    <button id="zoom-mes" title="Apropar la vista activa">+</button>
  </div>
  <button id="zoom-1" title="Escala real (100%)">1:1</button>
  <button id="ajusta-ample" title="Que la vista activa hi capi d'ample">↔ ample</button>
  <button id="ajusta-alt" title="Que la vista activa hi capi d'alçada">↕ alt</button>
  <button id="ajusta-tot" title="Totes les vistes obertes a la mateixa escala i encabides">⤢ totes iguals</button>
  <label class="amb-select">graella
    <select id="ordre" title="Com es reparteixen els formats a la pantalla">
      <optgroup label="Graella">
        <option value="uniforme">Uniforme (cel·les iguals)</option>
        <option value="mosaic">Mosaic (columnes que s'omplen)</option>
        <option value="prestatge">Prestatge (files al més just)</option>
        <option value="iguales">Columnes iguals</option>
        <option value="quadrada">Quadrada</option>
      </optgroup>
      <optgroup label="Altres">
        <option value="mida">Per mida (esglaons)</option>
        <option value="files">Files per grup</option>
        <option value="columnes">Columnes per grup</option>
        <option value="horitzontal">Una filera</option>
        <option value="vertical">Una columna</option>
      </optgroup>
    </select>
  </label>
  <button id="global" title="Al mosaic, ensenyar també els formats que no tenen pestanya">Tots al mosaic</button>
  <button id="recarrega" title="Recarregar TOTES les vistes obertes, tambe les de les altres pestanyes">Recarregar tot</button>
  <button id="navegador" title="Mostrar o amagar el dibuix del navegador">Navegador</button>
  <label class="amb-select">vives
    <select id="sostre" title="Quantes vistes vives alhora. Cada vista és una aplicació sencera: més vistes, més memòria.">
      <option value="4">4</option>
      <option value="8">8</option>
      <option value="12">12</option>
      <option value="15">15</option>
      <option value="99">totes</option>
    </select>
  </label>
  <span class="ajuda" id="ajuda"></span>
</div>

<div class="pestanyes" id="pestanyes"></div>
<div class="tauler" id="tauler"><div class="llenç" id="llenç"></div></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   OVERLAY DE FORMATS

   EL MODEL
   --------
   - L'ACORDIO (el panell de l'esquerra) es plega i no ocupa pantalla. Dins hi
     ha els formats per grups; marcar-ne un OBRE LA SEVA PESTANYA.
   - UNA PESTANYA PER FORMAT. Cada pestanya te els seus parametres: el seu zoom,
     el seu ajust, la seva ruta i la seva posicio de scroll. Son independents.
   - LA PANTALLA PRINCIPAL es una GRAELLA amb els formats que tenen pestanya.
     Un format sense pestanya no hi surt.
   - LA VISTA GLOBAL (un boto) es l'excepcio: ensenya TOTS els formats, tinguin
     pestanya o no, i es on hi ha les miniatures proporcionals.

   LES VISTES SON A ESCALA REAL. L'iframe sempre rep la mida exacta del
   dispositiu; el zoom es un transform sobre la capsa, no una mida falsa. Aixo
   vol dir que les media queries, el 100vh i el que calcula el navegador de dins
   son reals, i que el que canvia amb el zoom es com ho mires.

   Cada marc te DOS elements: la capsa (el contingut, a mida de dispositiu de
   veritat) i l'embolcall, que fa la mida JA ESCALADA. El repartiment treballa
   amb l'embolcall, i per aixo cada vista pot tenir el seu propi zoom sense que
   res se superposi.
   ═══════════════════════════════════════════════════════════════════════════ */

// ── ELS FORMATS ────────────────────────────────────────────────────────────
// `ct`/`cb` son els pixels que el navegador es menja de dalt i de baix:
// finestra = h - ct - cb. `img` es el dibuix del navegador; els que no en tenen
// porten una barra ratllada de la mateixa alcada (val mes una barra honesta que
// una captura estirada, que deformaria la barra).
const FORMATS = [
  { id: 'desktop',           nom: 'Escriptori 1920',        grup: 'Escriptori',       w: 1920, h: 1080, ct: 134, cb: 0,  img: '/browser-frames/desktop-chrome.webp' },
  { id: 'desktop-1440',      nom: 'Portàtil 1440',          grup: 'Portàtil',         w: 1440, h: 900,  ct: 134, cb: 0,  img: '/browser-frames/desktop-chrome-1440x900.webp' },
  { id: 'desktop-1366',      nom: 'Portàtil 1366',          grup: 'Portàtil',         w: 1366, h: 768,  ct: 134, cb: 0,  img: '/browser-frames/desktop-chrome-1366x768.webp' },
  { id: 'desktop-1280',      nom: 'Portàtil 1280',          grup: 'Portàtil',         w: 1280, h: 720,  ct: 134, cb: 0,  img: '/browser-frames/desktop-chrome-1280x720.webp' },
  { id: 'ipad-1180',         nom: 'iPad 10/11a',            grup: 'Tauleta apaïsada', w: 1180, h: 820,  ct: 78,  cb: 0,  img: null },
  { id: 'tabs9-plus',        nom: 'Galaxy Tab S9+',         grup: 'Tauleta apaïsada', w: 1200, h: 800,  ct: 78,  cb: 0,  img: null },
  { id: 'tablet-landscape',  nom: 'Tauleta apaïsada 1024',  grup: 'Tauleta apaïsada', w: 1024, h: 768,  ct: 78,  cb: 0,  img: '/browser-frames/tablet-landscape-safari.webp' },
  { id: 'tablet-portrait',   nom: 'Tauleta vertical 768',   grup: 'Tauleta vertical', w: 768,  h: 1024, ct: 72,  cb: 0,  img: '/browser-frames/tablet-portrait-safari.webp' },
  { id: 'ipad-mini',         nom: 'iPad mini 6',            grup: 'Tauleta vertical', w: 744,  h: 1133, ct: 72,  cb: 0,  img: null },
  { id: 'tabs9',             nom: 'Galaxy Tab S9',          grup: 'Tauleta vertical', w: 712,  h: 1138, ct: 72,  cb: 0,  img: null },
  { id: 'mobile-portrait',   nom: 'Mòbil vertical 390',     grup: 'Mòbil',            w: 390,  h: 844,  ct: 88,  cb: 44, img: '/browser-frames/mobile-portrait-safari.webp' },
  { id: 'mobile-landscape',  nom: 'Mòbil apaïsat 844',      grup: 'Mòbil',            w: 844,  h: 390,  ct: 50,  cb: 0,  img: '/browser-frames/mobile-landscape-safari.webp' },
  { id: 'se-landscape',      nom: 'iPhone SE apaïsat',      grup: 'Mòbil',            w: 667,  h: 375,  ct: 50,  cb: 0,  img: null },
  { id: 'android-landscape', nom: 'Android 16:9 apaïsat',   grup: 'Mòbil',            w: 640,  h: 360,  ct: 50,  cb: 0,  img: null },
  { id: 'pwa',               nom: 'PWA 390',                grup: 'PWA',              w: 390,  h: 844,  ct: 14,  cb: 0,  img: '/browser-frames/pwa-standalone.webp' },
];
const GRUPS = ['Escriptori', 'Portàtil', 'Tauleta apaïsada', 'Tauleta vertical', 'Mòbil', 'PWA'];
/** Vertical = mes alt que ample; horitzontal = mes ample que alt. */
const orientacio = (f) => (f.h > f.w ? 'vertical' : 'horitzontal');
const PER_ID = Object.fromEntries(FORMATS.map((f) => [f.id, f]));
const TOTS = FORMATS.map((f) => f.id).sort((a, b) => PER_ID[b].w - PER_ID[a].w);

const MARGES = 34;       // aire al voltant del llenç
const GAP = 26;          // separacio entre marcs
const AMPLE_CELLA = 760; // amplada de referencia per escalar una vista nova

// ── ESTAT ──────────────────────────────────────────────────────────────────
// Es desa a `localStorage`: qui te sis formats oberts no els vol tornar a
// obrir cada cop.
const CLAU = 'hg-overlay-estat-v4';

// LA PESTANYA PRINCIPAL es el mosaic: hi surten totes les pantalles obertes,
// proporcionals i a la mateixa escala. La resta de pestanyes son d'UN format
// cada una, i alla nomes hi ha el seu format.
const PRINCIPAL = 'principal';
const pestanyaNova = (id, ruta) => ({ id, ruta: ruta || '/', zoom: null, ajust: null, scroll: { x: 0, y: 0 } });
const tabPrincipal = () => ({ id: PRINCIPAL, ruta: '/', zoom: null, ajust: 'tot', scroll: { x: 0, y: 0 } });

function estatInicial() {
  return {
    // La primera sempre es la principal; despres, una entrada per format obert.
    pestanyes: [tabPrincipal(), pestanyaNova('desktop-1440'), pestanyaNova('mobile-portrait')],
    activa: PRINCIPAL,
    ordre: 'mosaic',
    sostre: 8,
    tots: false,
    // El filtre es TRANSIENT: no es desa, perque al cap d'un refresc una llista
    // a mitges sembla que hagi perdut formats. Pero HA D'EXISTIR SEMPRE: si
    // falta, `pintaAcordio` no sap quin boto marcar i l'acordio peta.
    filtre: 'tots',          // 'tots' | 'vertical' | 'horitzontal'
    ambNavegador: true,      // ensenyar el dibuix del navegador o tallar a la finestra
    panell: false,
    grupsOberts: [...GRUPS],
  };
}

function carrega() {
  try {
    const cru = localStorage.getItem(CLAU);
    if (!cru) return null;
    const e = JSON.parse(cru);
    if (!e || !Array.isArray(e.pestanyes)) return null;
    // Les pestanyes de format han de ser formats que existeixin; la principal
    // sempre hi ha de ser i ha d'anar primera.
    const formats = e.pestanyes.filter((p) => p.id !== PRINCIPAL && PER_ID[p.id]);
    e.pestanyes = [tabPrincipal(), ...formats];
    if (!e.pestanyes.some((p) => p.id === e.activa)) e.activa = PRINCIPAL;
    if (!e.ordre || e.ordre === 'graella') e.ordre = 'mosaic';
    e.tots = false;
    e.filtre = 'tots';
    // Estats desats quan el defecte era tenir nomes un grup obert: s'obren tots.
    if (!Array.isArray(e.grupsOberts) || !e.grupsOberts.length || (e.grupsOberts.length === 1 && e.grupsOberts[0] === 'Portàtil')) {
      e.grupsOberts = [...GRUPS];
    }
    return e;
  } catch { return null; }
}

/**
 * Migracio de l'estat antic (`v3`): alla les pestanyes eren els formats oberts
 * i prou. Es recuperen tal qual, amb la principal al davant. Buidar la feina de
 * qui te vuit formats oberts perque he canviat la forma de l'estat no es acceptable.
 */
function carregaV3() {
  try {
    const cru = localStorage.getItem('hg-overlay-estat-v3');
    if (!cru) return null;
    const vell = JSON.parse(cru);
    if (!vell || !Array.isArray(vell.pestanyes)) return null;
    const formats = vell.pestanyes.map((p) => p.id).filter((id) => PER_ID[id]);
    if (!formats.length) return null;
    return {
      ...estatInicial(),
      pestanyes: [tabPrincipal(), ...formats.map((id) => pestanyaNova(id, (vell.pestanyes.find((p) => p.id === id) || {}).ruta || '/'))],
      activa: formats.includes(vell.activa) ? vell.activa : PRINCIPAL,
    };
  } catch { return null; }
}

let estat = carrega() || carregaV3() || estatInicial();

// `?ruta=/nova/inici` posa aquesta ruta a totes les pestanyes: es com s'obria
// l'eina abans de tenir pestanyes, i es la manera rapida de dir-li quina pagina.
const RUTA_URL = (() => {
  try {
    const r = (new URLSearchParams(location.search).get('ruta') || '').trim();
    return r ? (r.startsWith('/') ? r : '/' + r) : null;
  } catch { return null; }
})();
if (RUTA_URL) for (const p of estat.pestanyes) p.ruta = RUTA_URL;

let desaPendent = null;
function desa() {
  clearTimeout(desaPendent);
  desaPendent = setTimeout(() => { try { localStorage.setItem(CLAU, JSON.stringify(estat)); } catch { /* ignore */ } }, 250);
}

const tabDe = (id) => estat.pestanyes.find((p) => p.id === id);
const tabActiva = () => tabDe(estat.activa) || estat.pestanyes[0] || null;
const esPrincipal = (p) => !!p && p.id === PRINCIPAL;
/** Els formats que tenen pestanya (sense comptar la principal). */
const oberts = () => estat.pestanyes.filter((p) => p.id !== PRINCIPAL).map((p) => p.id);
/**
 * Que s'ensenya a la pestanya activa:
 *   - a la principal, el MOSAIC (els formats oberts, o tots si hi ha `tots`)
 *   - a una de format, NOMES el seu format
 */
function visibles() {
  const p = tabActiva();
  if (!p) return [];
  if (esPrincipal(p)) return estat.tots ? TOTS : oberts();
  return [p.id];
}
/** Els formats que poden tenir un marc viu (per comptar el sostre). */
const candidats = () => (estat.tots && esPrincipal(tabActiva()) ? TOTS : oberts());

// ── ELS MARCS ──────────────────────────────────────────────────────────────
const tauler = document.getElementById('tauler');
const llenç = document.getElementById('llenç');
const marcs = new Map();   // formatId -> marc (un per format, com les pestanyes)
let ullObert = estat.ambNavegador !== false;   // true = el marc es el dispositiu sencer
/**
 * La mida del marc.
 *
 * AMB el navegador, el marc fa la mida del DISPOSITIU (1920x1080) i la finestra
 * que rep la pagina es la de dins (1080 menys la barra).
 *
 * SENSE el navegador, el marc queda TALLAT a la FINESTRA: 1920x946. No es nomes
 * amagar el dibuix; allo deixava una franja blanca a dalt i el marc seguia
 * ocupant el que ocupava el navegador, que es el que no vols quan estas mirant
 * la pagina.
 */
function midaMarc(fmt) {
  return ullObert
    ? { w: fmt.w, h: fmt.h }
    : { w: fmt.w, h: fmt.h - fmt.ct - fmt.cb };
}
let mides = [];            // les mides JA ESCALADES de l'ultim repartiment

const ampleUtil = () => tauler.clientWidth - MARGES * 2;
const altUtil = () => tauler.clientHeight - MARGES * 2;

function zoomDe(id) {
  const p = tabActiva();
  if (!p) return 1;
  // Al mosaic, TOTES les pantalles a la mateixa escala: es el que les fa
  // comparables i proporcionals entre elles.
  if (esPrincipal(p)) {
    if (p.ajust) return zoomMosaicAjustat(p.ajust === 'ample' ? 'ample' : p.ajust === 'alt' ? 'alt' : 'tot');
    return estat.zoomMosaic || 0.15;
  }
  // A la pestanya d'un format, el seu propi zoom.
  const mm = midaMarc(PER_ID[id]);
  if (p.ajust === 'ample') return Math.max(0.05, ampleUtil() / mm.w);
  if (p.ajust === 'alt') return Math.max(0.05, altUtil() / mm.h);
  if (p.ajust === 'tot') return Math.max(0.05, Math.min(ampleUtil() / mm.w, altUtil() / mm.h));
  if (p.zoom) return p.zoom;
  // Una pestanya nova s'obre a una escala raonable, i MAI per sobre de 1:1: els
  // mobils es veuen a mida real i els escriptoris encongits.
  return Math.min(1, AMPLE_CELLA / mm.w);
}

function creaMarc(id) {
  if (marcs.has(id)) return marcs.get(id);
  const fmt = PER_ID[id];

  const el = document.createElement('div');
  el.className = 'marc';
  el.dataset.format = id;

  const escala = document.createElement('div');
  escala.className = 'escala';

  const mm = midaMarc(fmt);
  const caixa = document.createElement('div');
  caixa.className = 'caixa';
  caixa.style.width = mm.w + 'px';
  caixa.style.height = mm.h + 'px';

  const iframe = document.createElement('iframe');
  iframe.className = 'finestra';
  iframe.title = fmt.nom;
  iframe.style.width = fmt.w + 'px';
  iframe.style.height = (fmt.h - fmt.ct - fmt.cb) + 'px';
  iframe.style.marginTop = (ullObert ? fmt.ct : 0) + 'px';

  const parts = [];
  if (fmt.img) {
    const img = document.createElement('img');
    img.className = 'barra-navegador';
    img.src = fmt.img; img.alt = '';
    img.style.width = fmt.w + 'px'; img.style.height = fmt.h + 'px';
    img.style.display = ullObert ? '' : 'none';
    parts.push(img);
  } else {
    const barra = document.createElement('div');
    barra.className = 'falsa-barra';
    barra.style.height = fmt.ct + 'px';
    barra.style.display = ullObert ? '' : 'none';
    barra.textContent = `navegador ${fmt.ct} px`;
    parts.push(barra);
  }
  if (fmt.cb > 0) {
    const baix = document.createElement('div');
    baix.className = 'falsa-barra';
    baix.style.height = fmt.cb + 'px'; baix.style.top = 'auto'; baix.style.bottom = '0';
    baix.style.display = ullObert ? '' : 'none';
    baix.textContent = `barra ${fmt.cb} px`;
    parts.push(baix);
  }

  const carregant = document.createElement('div');
  carregant.className = 'carregant';
  carregant.textContent = `Carregant ${fmt.nom}…`;

  const sensVisita = document.createElement('div');
  sensVisita.className = 'sens-visita';
  const contingut = document.createElement('div');
  contingut.className = 'contingut';
  contingut.innerHTML = `<div>${fmt.nom}<br><span style="opacity:.7">${fmt.w}×${fmt.h}</span></div>`;
  const botoVeure = document.createElement('button');
  botoVeure.textContent = '▶ Carregar aquesta vista';
  contingut.append(botoVeure);
  sensVisita.append(contingut);

  caixa.append(...parts, iframe, carregant, sensVisita);
  escala.append(caixa);

  const etiqueta = document.createElement('div');
  etiqueta.className = 'etiqueta';
  etiqueta.innerHTML = `<span class="nom"></span><span class="mida">${mm.w}×${mm.h}</span><span class="estat"></span>`;
  etiqueta.querySelector('.nom').textContent = fmt.nom;
  const recarrega = document.createElement('button');
  recarrega.textContent = '⟳'; recarrega.title = 'Recarregar aquesta vista';
  const tanca = document.createElement('button');
  tanca.textContent = '✕'; tanca.title = 'Tancar aquesta pestanya';
  etiqueta.append(recarrega, tanca);

  el.append(escala, etiqueta);

  const marc = { el, escala, caixa, iframe, etiqueta, carregant, sensVisita, botoVeure, fmt, viu: false, carregat: false, fixat: false };
  // El boto de dins de la silueta tambe diu la mida que es veura.
  contingut.firstElementChild.innerHTML = `${fmt.nom}<br><span style="opacity:.7">${mm.w}×${mm.h}</span>`;
  iframe.addEventListener('load', () => { marc.carregat = true; el.classList.add('carregat'); });
  recarrega.addEventListener('click', (e) => { e.stopPropagation(); recarregaMarc(marc); });
  tanca.addEventListener('click', (e) => { e.stopPropagation(); tancaPestanya(id); });
  botoVeure.addEventListener('click', (e) => { e.stopPropagation(); muntaMarc(marc, true); });
  el.addEventListener('click', () => activaPestanya(id));
  el.addEventListener('dblclick', () => muntaMarc(marc, true));

  marcs.set(id, marc);
  return marc;
}

/** Posa un marc al mode d'ara: amb el navegador, o tallat a la finestra. */
function aplicaNavegador(marc) {
  const mm = midaMarc(marc.fmt);
  marc.caixa.style.height = mm.h + 'px';
  marc.iframe.style.marginTop = (ullObert ? marc.fmt.ct : 0) + 'px';
  marc.etiqueta.querySelector('.mida').textContent = `${mm.w}×${mm.h}`;
  marc.caixa.querySelectorAll('.barra-navegador, .falsa-barra').forEach((b) => { b.style.display = ullObert ? '' : 'none'; });
}

function muntaMarc(marc, fixa = false) {
  if (marc.viu) return;
  marc.viu = true;
  if (fixa) marc.fixat = true;
  marc.el.classList.remove('carregat');
  marc.carregat = false;
  marc.iframe.src = (tabDe(marc.fmt.id) || {}).ruta || '/';
  marc.sensVisita.style.display = 'none';
  actualitzaEtiqueta(marc);
}

function desmuntaMarc(marc) {
  if (!marc.viu) return;
  marc.viu = false; marc.fixat = false; marc.carregat = false;
  marc.el.classList.remove('carregat');
  marc.iframe.src = 'about:blank';
  marc.sensVisita.style.display = '';
  actualitzaEtiqueta(marc);
}

function recarregaMarc(marc) {
  if (!marc.viu) { muntaMarc(marc, true); return; }
  marc.el.classList.remove('carregat');
  marc.carregat = false;
  marc.iframe.src = marc.iframe.src;
}

function actualitzaEtiqueta(marc) {
  marc.etiqueta.querySelector('.estat').textContent = marc.viu ? '' : 'aturat';
}

function tancaPestanya(id) {
  if (id === PRINCIPAL) return;   // la principal no es tanca
  const i = estat.pestanyes.findIndex((p) => p.id === id);
  if (i < 0) return;
  const m = marcs.get(id);
  if (m) { desmuntaMarc(m); m.el.remove(); marcs.delete(id); }
  estat.pestanyes.splice(i, 1);
  if (estat.activa === id) {
    estat.activa = estat.pestanyes[Math.min(i, estat.pestanyes.length - 1)]?.id || null;
  }
  pintaTot();
  desa();
}

function obrePestanya(id) {
  if (!tabDe(id)) {
    const ruta = RUTA_URL || (tabActiva() ? tabActiva().ruta : '/');
    estat.pestanyes.push(pestanyaNova(id, ruta));
  }
  activaPestanya(id);
}

function activaPestanya(id) {
  estat.activa = id;
  pintaTot();
  if (id !== PRINCIPAL) marcs.get(id)?.el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  desa();
}

// ── QUANTES VISTES VIUES ───────────────────────────────────────────────────
// Cada vista viva es una aplicacio sencera carregada al navegador. Es munten
// les que es veuen, de la mes gran a la mes petita, fins al sostre; la resta
// surten com a silueta amb un boto. Les que demanes tu (boto o doble clic) no
// es desmunten mai soles.
const sostreVius = () => Number(estat.sostre) || 8;

function areaVisible(m) {
  const b = m.el.getBoundingClientRect();
  const x = Math.max(0, Math.min(b.right, window.innerWidth) - Math.max(b.left, 0));
  const y = Math.max(0, Math.min(b.bottom, window.innerHeight) - Math.max(b.top, 0));
  return x * y;
}

function muntaLesQueToca() {
  const llista = candidats().map((id) => marcs.get(id)).filter(Boolean);
  const vius = llista.filter((m) => m.viu);
  const candidates = llista.filter((m) => !m.viu && areaVisible(m) > 0).sort((a, b) => areaVisible(b) - areaVisible(a));
  for (const m of candidates) {
    if (m.viu) continue;
    if (m.fixat || vius.length < sostreVius()) { muntaMarc(m); vius.push(m); }
  }
  const sobrants = vius.filter((m) => !m.fixat).sort((a, b) => areaVisible(a) - areaVisible(b));
  for (let i = 0; i < sobrants.length && vius.length > sostreVius(); i++) {
    const m = sobrants[i];
    desmuntaMarc(m);
    const k = vius.indexOf(m);
    if (k >= 0) vius.splice(k, 1);
  }
}

// ── EL REPARTIMENT ─────────────────────────────────────────────────────────
/**
 * Reparteix les mides JA ESCALADES de cada vista i torna posicions en pixels de
 * pantalla: com que cada marc te el seu propi zoom, el llenç no s'escala sencer.
 *
 * `columnes`:
 *   - 'pantalla'  la graella fa tantes columnes com caben de ample
 *   - 'quadrat'   la graella es fa mes o menys quadrada (per ajustar-ho tot)
 */
function reparteix(mides_, mode) {
  const pos = new Map();
  const etiquetes = [];
  if (!mides_.length) return { pos, etiquetes, ample: 0, alt: 0 };
  const perGrup = (llista) => {
    const g = new Map();
    for (const m of llista) {
      const gr = PER_ID[m.id].grup;
      if (!g.has(gr)) g.set(gr, []);
      g.get(gr).push(m);
    }
    return g;
  };
  let ample = 0, alt = 0;

  const av = tauler.clientWidth - MARGES * 2;
  const cw = Math.max(...mides_.map((m) => m.w));
  const ch = Math.max(...mides_.map((m) => m.h));
  const columnesQueHiCaben = () => Math.max(1, Math.floor((av + GAP) / (cw + GAP)));

  if (mode === 'mosaic') {
    // Mosaic: columnes que s'omplen. Cada marc va a la columna mes curta, i la
    // columna es tan ampla com el marc mes ampla. Es el que aprofita millor
    // l'espai quan les mides son molt diferents.
    const n = columnesQueHiCaben();
    const altures = new Array(n).fill(0);
    for (const m of [...mides_].sort((a, b) => b.w * b.h - a.w * a.h)) {
      let k = 0;
      for (let i = 1; i < n; i++) if (altures[i] < altures[k]) k = i;
      pos.set(m.id, { x: k * (cw + GAP), y: altures[k] });
      altures[k] += m.h + GAP;
    }
    ample = n * (cw + GAP) - GAP;
    alt = Math.max(...altures) - GAP;
  } else if (mode === 'prestatge') {
    // Prestatge: files que s'omplen d'esquerra a dreta fins que no hi cap mes.
    let x = 0, y = 0, altFila = 0;
    const ampleRef = Math.max(av, cw);
    for (const m of mides_) {
      if (x > 0 && x + m.w > ampleRef) { x = 0; y += altFila + GAP; altFila = 0; }
      pos.set(m.id, { x, y });
      x += m.w + GAP;
      altFila = Math.max(altFila, m.h);
      ample = Math.max(ample, x - GAP);
    }
    alt = y + altFila;
  } else if (mode === 'iguales') {
    // Columnes iguals: la mateixa amplada per a tothom, omplint per columnes.
    const n = columnesQueHiCaben();
    const compte = new Array(n).fill(0);
    mides_.forEach((m, i) => {
      const k = i % n;
      pos.set(m.id, { x: k * (cw + GAP) + (cw - m.w) / 2, y: compte[k] });
      compte[k] += m.h + GAP;
    });
    ample = n * (cw + GAP) - GAP;
    alt = Math.max(...compte) - GAP;
  } else if (mode === 'horitzontal' || mode === 'vertical') {
    let x = 0, y = 0;
    for (const m of mides_) {
      pos.set(m.id, { x, y });
      if (mode === 'horitzontal') x += m.w + GAP; else y += m.h + GAP;
    }
    ample = mode === 'horitzontal' ? x - GAP : Math.max(...mides_.map((m) => m.w));
    alt = mode === 'horitzontal' ? Math.max(...mides_.map((m) => m.h)) : y - GAP;
  } else if (mode === 'uniforme' || mode === 'quadrada') {
    const n = mode === 'uniforme'
      ? columnesQueHiCaben()
      : Math.max(1, Math.round(Math.sqrt(mides_.length * ch / Math.max(cw, 1))));
    mides_.forEach((m, i) => {
      const cx = i % n, cy = Math.floor(i / n);
      // Dins la seva cel·la, centrat.
      pos.set(m.id, { x: cx * (cw + GAP) + (cw - m.w) / 2, y: cy * (ch + GAP) + (ch - m.h) / 2 });
    });
    ample = n * (cw + GAP) - GAP;
    alt = Math.ceil(mides_.length / n) * (ch + GAP) - GAP;
  } else if (mode === 'mida') {
    let x = 0, y = 0, altFila = 0;
    const ampleRef = Math.max(1600, ...mides_.map((m) => m.w));
    for (const m of mides_) {
      if (x > 0 && x + m.w > ampleRef) { x = 0; y += altFila + GAP; altFila = 0; }
      pos.set(m.id, { x, y });
      x += m.w + GAP;
      altFila = Math.max(altFila, m.h);
      ample = Math.max(ample, x - GAP);
    }
    alt = y + altFila;
  } else {
    // Files / columnes per grup, amb l'etiqueta del grup dins del primer marc.
    const g = perGrup(mides_);
    if (mode === 'files') {
      let y = 0;
      for (const [nom, llista] of g) {
        let x = 0, altFila = 0;
        llista.forEach((m, i) => {
          pos.set(m.id, { x, y });
          if (i === 0) etiquetes.push({ text: nom, x: x + 8, y: y + 8 });
          x += m.w + GAP;
          altFila = Math.max(altFila, m.h);
        });
        ample = Math.max(ample, x - GAP);
        y += altFila + GAP * 2;
      }
      alt = y - GAP * 2;
    } else {
      let x = 0;
      for (const [nom, llista] of g) {
        let y = 0, ampleCol = 0;
        llista.forEach((m, i) => {
          pos.set(m.id, { x, y });
          if (i === 0) etiquetes.push({ text: nom, x: x + 8, y: y + 8 });
          y += m.h + GAP;
          ampleCol = Math.max(ampleCol, m.w);
        });
        x += ampleCol + GAP * 2;
        alt = Math.max(alt, y - GAP);
      }
      ample = x - GAP * 2;
    }
  }
  return { pos, etiquetes, ample, alt };
}

/**
 * El zoom que fa que un conjunt de formats hi capigui alhora.
 *
 * Es un PUNT FIX, i no es pot fer d'una passada: la disposicio depen del zoom
 * (a mes zoom, menys columnes) i el zoom depen de la disposicio. Amb una sola
 * passada, la graella que s'ajusta i la que es pinta no coincideixen i el
 * resultat no hi acaba de caber. S'itera fins que el zoom no es mou.
 */
function zQueEncabeix(mides1, mode, eix = 'tot') {
  const av = tauler.clientWidth - MARGES * 2;
  const aa = tauler.clientHeight - MARGES * 2;
  const hiCap = (z) => {
    const m = mides1.map((x) => ({ id: x.id, w: x.w * z, h: x.h * z }));
    const { ample, alt } = reparteix(m, mode);
    if (eix === 'ample') return ample <= av;
    if (eix === 'alt') return alt <= aa;
    return ample <= av && alt <= aa;
  };
  if (hiCap(1)) return 1;
  // BISECCIO, no punt fix. Amb punt fix el calcul oscil·lava: la disposicio canvia
  // a salts (una columna mes o menys) i la formula saltava entre dos valors, un
  // dels quals no hi cabia. La biseccio busca el mes gran que hi cap.
  let baix = 0.02, dalt = 1;
  for (let i = 0; i < 24; i++) {
    const mig = (baix + dalt) / 2;
    if (hiCap(mig)) baix = mig; else dalt = mig;
  }
  // `hiCap` no es estrictament monotona (la graella fa salts), aixi que es
  // comprova el resultat i, si cal, s'abaixa una mica.
  let z = baix;
  for (let i = 0; i < 12 && !hiCap(z); i++) z *= 0.94;
  return Math.max(0.02, z);
}

/** El zoom del mosaic: totes les pantalles que hi surten, encabides i iguals. */
function zoomMosaicAjustat(eix = 'tot') {
  const ids = visibles();
  if (!ids.length) return 0.15;
  return zQueEncabeix(ids.map((id) => ({ id, ...midaMarc(PER_ID[id]) })), estat.ordre, eix);
}

// ── PINTAR ─────────────────────────────────────────────────────────────────
function pintaTauler({ guardaScroll = false } = {}) {
  const act = tabActiva();
  const principal = esPrincipal(act);
  if (guardaScroll && act) act.scroll = { x: tauler.scrollLeft, y: tauler.scrollTop };
  const ids = visibles();
  mides = ids.map((id) => {
    const mm = midaMarc(PER_ID[id]);
    const z = zoomDe(id);
    return { id, w: Math.round(mm.w * z), h: Math.round(mm.h * z), z };
  });
  // A una pestanya de format tambe hi ha d'haver la resta de marcs muntats (son
  // les altres pestanyes): nomes s'amaguen. Destruir-los voldria dir que anar a
  // veure un format i tornar recarregues el mosaic sencer.
  const { pos, etiquetes, ample, alt } = reparteix(mides, estat.ordre);
  const volguts = new Set(ids);
  for (const [id, m] of marcs) {
    if (!volguts.has(id)) m.el.style.display = 'none';
  }
  for (const m of mides) {
    const marc = creaMarc(m.id);
    const q = pos.get(m.id) || { x: 0, y: 0 };
    marc.el.style.left = (q.x + MARGES) + 'px';
    marc.el.style.top = (q.y + MARGES) + 'px';
    marc.el.style.width = m.w + 'px';
    marc.el.style.height = m.h + 'px';
    marc.escala.style.transform = `scale(${m.z})`;
    marc.el.style.display = '';
    marc.el.classList.toggle('actiu', !principal && m.id === estat.activa);
    if (marc.el.parentElement !== llenç) llenç.append(marc.el);
  }
  for (const e of llenç.querySelectorAll('.etiqueta-grup')) e.remove();
  for (const e of etiquetes) {
    const d = document.createElement('div');
    d.className = 'etiqueta-grup';
    d.textContent = e.text;
    d.style.left = (e.x + MARGES) + 'px';
    d.style.top = (e.y + MARGES) + 'px';
    llenç.append(d);
  }
  llenç.style.width = (ample + MARGES * 2) + 'px';
  llenç.style.height = (alt + MARGES * 2) + 'px';

  const avís = llenç.querySelector('.sense-res');
  if (!ids.length && !avís) {
    const d = document.createElement('div');
    d.className = 'sense-res';
    d.textContent = 'Cap format obert. Obre\'n un des de la llista de l\'esquerra (☰): cada format que marquis tindrà la seva pestanya, i aquí en veuràs el mosaic.';
    llenç.append(d);
  } else if (ids.length && avís) avís.remove();

  if (guardaScroll && act) tauler.scrollTo(act.scroll.x, act.scroll.y);
  muntaLesQueToca();
  actualitzaBarra();
  desa();
}

// ── BARRA, PESTANYES I ACORDIÓ ─────────────────────────────────────────────
const barraRuta = document.getElementById('ruta');
const barraZoom = document.getElementById('zoom-num');
const barraOrdre = document.getElementById('ordre');
const ajuda = document.getElementById('ajuda');

function actualitzaBarra() {
  const act = tabActiva();
  const principal = esPrincipal(act);
  barraRuta.value = principal ? '' : (act ? act.ruta : '/');
  barraRuta.disabled = principal || !act;
  barraRuta.placeholder = principal ? 'cada format té la seva' : '/';
  barraOrdre.value = estat.ordre;
  barraOrdre.disabled = !principal;   // l'ordre només mana al mosaic
  const z = zoomActual();
  barraZoom.textContent = Math.round(z * 100) + '%';
  document.getElementById('ajusta-ample').classList.toggle('actiu', act?.ajust === 'ample');
  document.getElementById('ajusta-alt').classList.toggle('actiu', act?.ajust === 'alt');
  document.getElementById('zoom-1').classList.toggle('actiu', act && !act.ajust && Math.abs((act.zoom || 0) - 1) < 0.001);
  document.getElementById('global').classList.toggle('actiu', !!estat.tots);
  document.getElementById('global').disabled = !principal;
  document.getElementById('sostre').value = String(estat.sostre || 8);
  const vius = [...marcs.values()].filter((m) => m.viu).length;
  ajuda.textContent = principal
    ? `${visibles().length} pantalles al mosaic · ${vius} vives (sostre ${sostreVius()})`
    : `${act ? PER_ID[act.id].nom : ''} · ${vius} vives · el mosaic és a la pestanya Principal`;
}

function pintaPestanyes() {
  const cont = document.getElementById('pestanyes');
  cont.innerHTML = '';
  if (!estat.pestanyes.length) {
    const b = document.createElement('span');
    b.className = 'buit';
    b.textContent = 'Cap format obert. Obre\'n un des de la llista (☰).';
    cont.append(b);
    return;
  }
  for (const p of estat.pestanyes) {
    const principal = esPrincipal(p);
    const f = PER_ID[p.id];
    const b = document.createElement('button');
    b.className = 'pestanya' + (p.id === estat.activa ? ' activa' : '') + (principal ? ' principal' : '');
    b.innerHTML = principal
      ? `<span>▦ Principal</span><span class="mida">${estat.tots ? TOTS.length : oberts().length}</span>`
      : `<span>${f.nom}</span><span class="mida">${f.w}×${f.h}</span>`;
    if (!principal) {
      const x = document.createElement('span');
      x.className = 'tanca'; x.textContent = '✕'; x.title = 'Tancar aquesta pestanya';
      x.addEventListener('click', (e) => { e.stopPropagation(); tancaPestanya(p.id); });
      b.append(x);
    }
    b.addEventListener('click', () => activaPestanya(p.id));
    cont.append(b);
  }
}

const NOMS_FILTRE = { tots: 'Tots', vertical: 'Verticals', horitzontal: 'Horitzontals' };
/** Els formats que passen el filtre d'orientacio. */
const filtrats = () => FORMATS.filter((f) => estat.filtre === 'tots' || orientacio(f) === estat.filtre);

function pintaAcordio() {
  const cont = document.getElementById('grups');
  cont.innerHTML = '';

  // EL FILTRE: per veure i obrir nomes els verticals o nomes els horitzontals.
  // "Obrir" fa una pestanya per a cada format del filtre i ensenya el mosaic.
  const filtre = document.createElement('div');
  filtre.className = 'filtre';
  const fila1 = document.createElement('div');
  fila1.className = 'fila';
  const titol = document.createElement('span');
  titol.className = 'titol';
  titol.textContent = 'Orientació';
  fila1.append(titol);
  for (const clau of ['tots', 'vertical', 'horitzontal']) {
    const b = document.createElement('button');
    b.textContent = NOMS_FILTRE[clau];
    b.classList.toggle('actiu', estat.filtre === clau);
    b.title = clau === 'tots' ? 'Tots els formats' : `Només els formats ${NOMS_FILTRE[clau].toLowerCase()}`;
    b.addEventListener('click', () => {
      estat.filtre = clau;
      estat.grupsOberts = [...GRUPS];   // que es vegin els formats del filtre
      pintaAcordio();
      desa();
    });
    fila1.append(b);
  }
  const fila2 = document.createElement('div');
  fila2.className = 'fila';
  const perObrir = filtrats().filter((f) => !tabDe(f.id)).length;
  const bObre = document.createElement('button');
  bObre.className = 'obre';
  bObre.textContent = estat.filtre === 'tots' ? 'Obrir tots' : `Obrir els ${NOMS_FILTRE[estat.filtre].toLowerCase()}`;
  bObre.title = 'Obrir una pestanya per a cada format del filtre';
  bObre.disabled = perObrir === 0;
  bObre.addEventListener('click', obreFiltrats);
  const bTanca = document.createElement('button');
  bTanca.textContent = 'Tancar';
  bTanca.title = 'Tancar les pestanyes dels formats del filtre';
  bTanca.disabled = filtrats().every((f) => !tabDe(f.id));
  bTanca.addEventListener('click', tancaFiltrats);
  fila2.append(bObre, bTanca);
  filtre.append(fila1, fila2);
  cont.append(filtre);

  for (const g of GRUPS) {
    const fs = filtrats().filter((f) => f.grup === g);
    if (!fs.length) continue;
    const obert = (estat.grupsOberts || []).includes(g);
    const bloc = document.createElement('div');
    bloc.className = 'grup' + (obert ? ' obert' : '');
    const cap = document.createElement('button');
    cap.className = 'capçalera';
    const quants = fs.filter((f) => tabDe(f.id)).length;
    cap.innerHTML = `<span class="fletxa">▶</span><span>${g}</span><span class="compta">${quants}/${fs.length}</span>`;
    cap.addEventListener('click', () => {
      const i = estat.grupsOberts.indexOf(g);
      if (i >= 0) estat.grupsOberts.splice(i, 1); else estat.grupsOberts.push(g);
      pintaAcordio(); desa();
    });
    const llista = document.createElement('div');
    llista.className = 'llista';
    for (const f of fs) {
      const fila = document.createElement('label');
      fila.className = 'opcio';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!tabDe(f.id);
      cb.addEventListener('change', () => {
        if (cb.checked) obrePestanya(f.id); else tancaPestanya(f.id);
        pintaAcordio();
      });
      const nom = document.createElement('span');
      nom.className = 'nom'; nom.textContent = f.nom;
      const mida = document.createElement('span');
      mida.className = 'mida'; mida.textContent = `${f.w}×${f.h}`;
      fila.append(cb, nom, mida);
      llista.append(fila);
    }
    bloc.append(cap, llista);
    cont.append(bloc);
  }
}

/** Obra una pestanya per a cada format del filtre, d'una tacada. */
function obreFiltrats() {
  const ruta = RUTA_URL || (tabActiva() ? tabActiva().ruta : '/');
  for (const f of filtrats()) if (!tabDe(f.id)) estat.pestanyes.push(pestanyaNova(f.id, ruta));
  estat.activa = PRINCIPAL;   // i ensenya el mosaic, que es el que vols veure
  pintaTot();
  desa();
}

/** Tanca les pestanyes dels formats del filtre. */
function tancaFiltrats() {
  for (const f of filtrats()) {
    const m = marcs.get(f.id);
    if (m) { desmuntaMarc(m); m.el.remove(); marcs.delete(f.id); }
  }
  const fora = new Set(filtrats().map((f) => f.id));
  estat.pestanyes = estat.pestanyes.filter((p) => p.id === PRINCIPAL || !fora.has(p.id));
  if (!estat.pestanyes.some((p) => p.id === estat.activa)) estat.activa = PRINCIPAL;
  pintaTot();
  desa();
}

function pintaTot() {
  document.body.classList.toggle('panell-obert', !!estat.panell);
  pintaAcordio();
  pintaPestanyes();
  pintaTauler();
}

// ── CONTROLS ──────────────────────────────────────────────────────────────
function zoomActual() {
  const act = tabActiva();
  if (!act) return 1;
  return zoomDe(act.id);
}

function posaZoom(z) {
  const act = tabActiva();
  if (!act) return;
  if (esPrincipal(act)) { act.ajust = null; estat.zoomMosaic = Math.min(4, Math.max(0.02, z)); }
  else { act.ajust = null; act.zoom = Math.min(4, Math.max(0.05, z)); }
  pintaTauler();
}

document.getElementById('plega').addEventListener('click', () => { estat.panell = !estat.panell; pintaTot(); desa(); });
document.getElementById('zoom-mes').addEventListener('click', () => posaZoom(zoomActual() * 1.25));
document.getElementById('zoom-menys').addEventListener('click', () => posaZoom(zoomActual() / 1.25));
document.getElementById('zoom-1').addEventListener('click', () => posaZoom(1));
document.getElementById('ajusta-ample').addEventListener('click', () => {
  const a = tabActiva();
  if (!a) return;
  if (esPrincipal(a)) { a.ajust = 'ample'; estat.zoomMosaic = null; }
  else a.ajust = 'ample';
  pintaTauler();
});
document.getElementById('ajusta-alt').addEventListener('click', () => {
  const a = tabActiva();
  if (!a) return;
  if (esPrincipal(a)) { a.ajust = 'alt'; estat.zoomMosaic = null; }
  else a.ajust = 'alt';
  pintaTauler();
});
document.getElementById('ajusta-tot').addEventListener('click', () => {
  // Encabir-ho tot: al mosaic, totes les pantalles; en una pestanya de format,
  // el seu format. Es la manera de veure-ho sencer d'una ullada.
  const a = tabActiva();
  if (!a) return;
  if (esPrincipal(a)) { a.ajust = 'tot'; estat.zoomMosaic = null; }
  else a.ajust = 'tot';
  pintaTauler();
});
barraOrdre.addEventListener('change', () => { estat.ordre = barraOrdre.value; pintaTauler(); desa(); });
barraRuta.addEventListener('change', () => {
  const act = tabActiva();
  if (!act || esPrincipal(act)) return;
  let r = barraRuta.value.trim() || '/';
  if (!r.startsWith('/')) r = '/' + r;
  act.ruta = r;
  const m = marcs.get(act.id);
  if (m && m.viu) { m.el.classList.remove('carregat'); m.carregat = false; m.iframe.src = r; }
  desa();
});
document.getElementById('recarrega').addEventListener('click', () => {
  // TOTES les vistes obertes, tambe les de les altres pestanyes. Els marcs es
  // queden muntats a posta (canviar de pestanya no ha de recarregar res), i
  // allo vol dir que tampoc no agafen sols el codi nou de l'aplicacio: aquest
  // boto es la manera de dir-ho de cop. Un marc concret te el seu propia ⟳.
  for (const id of candidats()) { const m = marcs.get(id); if (m && m.viu) recarregaMarc(m); }
});
document.getElementById('navegador').addEventListener('click', (e) => {
  ullObert = !ullObert;
  estat.ambNavegador = ullObert;
  desa();
  e.target.classList.toggle('actiu', !ullObert);
  e.target.textContent = ullObert ? 'Navegador' : 'Tallat a la finestra';
  for (const m of marcs.values()) aplicaNavegador(m);
  pintaTauler();
});
document.getElementById('sostre').addEventListener('change', (e) => { estat.sostre = Number(e.target.value); desa(); muntaLesQueToca(); actualitzaBarra(); });
document.getElementById('global').addEventListener('click', () => {
  estat.tots = !estat.tots;
  estat.activa = PRINCIPAL;   // es una propietat del mosaic
  pintaTot();
  desa();
});

// Zoom amb la roda i la tecla de comandament, com als editors.
tauler.addEventListener('wheel', (e) => {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  posaZoom(zoomActual() * (e.deltaY < 0 ? 1.1 : 1 / 1.1));
}, { passive: false });

tauler.addEventListener('scroll', () => {
  const act = tabActiva();
  if (act) { act.scroll = { x: tauler.scrollLeft, y: tauler.scrollTop }; desa(); }
  muntaLesQueToca();
}, { passive: true });

let temps = null;
window.addEventListener('resize', () => {
  clearTimeout(temps);
  temps = setTimeout(() => pintaTauler(), 140);
});

// ── ENGEGAR ───────────────────────────────────────────────────────────────
{
  const b = document.getElementById('navegador');
  b.classList.toggle('actiu', !ullObert);
  b.textContent = ullObert ? 'Navegador' : 'Tallat a la finestra';
}
pintaTot();
</script>
