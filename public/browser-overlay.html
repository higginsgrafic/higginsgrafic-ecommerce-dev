<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overlay Navegador - Higgins</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #fff;
    font-family: -apple-system, system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
  }
  .toolbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: #0f0f1e;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 1000;
    border-bottom: 1px solid #333;
  }
  .toolbar h1 { font-size: 14px; margin-right: 8px; white-space: nowrap; }
  .toolbar button {
    background: #1a1a3e;
    color: #fff;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  .toolbar button:hover { background: #2a2a5e; }
  .toolbar .escala {
    display: flex; align-items: center; gap: 6px; font-size: 13px;
    background: #1a1a3e; border: 1px solid #444; border-radius: 6px; padding: 6px 10px;
    cursor: pointer; user-select: none;
  }
  .toolbar .escala input { cursor: pointer; }
  .toolbar .info {
    font-size: 11px;
    color: #888;
    margin-left: auto;
    text-align: right;
    line-height: 1.4;
  }

  /* LES PESTANYES. Una per format, i totes les que s'han obert es queden
     carregades: canviar de pestanya no torna a carregar res. */
  .tabs {
    position: fixed;
    top: 48px; left: 0; right: 0;
    background: #12122a;
    display: flex;
    align-items: stretch;
    gap: 2px;
    padding: 0 8px;
    z-index: 999;
    border-bottom: 1px solid #333;
    overflow-x: auto;
    overflow-y: hidden;
  }
  .tabs button {
    background: transparent;
    color: #99a;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 9px 12px;
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  .tabs button:hover { color: #dde; background: #1a1a3e; }
  .tabs button.actiu { color: #fff; border-bottom-color: #ff0040; }
  .tabs button .mida { color: #667; font-size: 11px; margin-left: 6px; }
  .tabs button.actiu .mida { color: #99a; }

  .stage {
    position: fixed;
    top: 84px; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    overflow: auto;
    background: #111;
    padding: 20px;
  }
  .device-frame {
    position: relative;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    flex: 0 0 auto;
  }
  .device-frame iframe {
    position: absolute;
    border: none;
    background: #fff;
  }
  .device-frame .browser-overlay {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 10;
  }
  .device-frame .viewport-marker {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: #ff0040;
    z-index: 11;
    pointer-events: none;
  }
  .device-frame .viewport-marker.bottom { bottom: 0; }
  .red-line { background: #ff0040; }
  /* El vel de carrega. La pagina triga uns segons a pintar i, sense aixo,
     el marc surt blanc i sembla que estigui espatllat. */
  .device-frame .carregant {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    color: #888;
    font-size: 13px;
    z-index: 12;
  }
  .device-frame.carregat .carregant { display: none; }
</style>
</head>
<body>

<div class="toolbar">
  <h1>Overlay Navegador</h1>
  <button id="reload">Recarregar</button>
  <button id="toggle-overlay">Amaga/Mostra navegador</button>
  <label class="escala" title="Veure el dispositiu a mida real, sense escalar">
    <input type="checkbox" id="escala1" /> 1:1
  </label>
  <span class="info" id="info"></span>
</div>

<div class="tabs" id="tabs"></div>
<div class="stage" id="stage"></div>

<script>
/**
 * ELS FORMATS.
 *
 * `chromeTop`/`chromeBottom` son els pixels que el navegador es menja de la
 * pantalla, i son el que governa la finestra que rep la pagina:
 *
 *     finestra = alcada de la pantalla - chromeTop - chromeBottom
 *
 * La `img` es nomes el dibuix del navegador, i per aixo cada format te la seva:
 * la barra d'un navegador no s'encongeix amb la finestra, i estirar la captura
 * d'una altra mida la deformaria.
 *
 * `scale` es com es veu per defecte; la casella `1:1` el posa a 1.
 */
const FORMATS = {
  'desktop': {
    img: '/browser-frames/desktop-chrome.webp',
    w: 1920, h: 1080,
    chromeTop: 134, chromeBottom: 0,
    scale: 0.5,
    label: 'Chrome · finestra 1920x946'
  },
  'desktop-1440': {
    img: '/browser-frames/desktop-chrome-1440x900.webp',
    w: 1440, h: 900,
    chromeTop: 134, chromeBottom: 0,
    scale: 0.75,
    label: 'Chrome · finestra 1440x766'
  },
  'desktop-1366': {
    img: '/browser-frames/desktop-chrome-1366x768.webp',
    w: 1366, h: 768,
    chromeTop: 134, chromeBottom: 0,
    scale: 0.8,
    label: 'Chrome · finestra 1366x634'
  },
  'desktop-1280': {
    img: '/browser-frames/desktop-chrome-1280x720.webp',
    w: 1280, h: 720,
    chromeTop: 134, chromeBottom: 0,
    scale: 0.85,
    label: 'Chrome · finestra 1280x586'
  },
  'tablet-landscape': {
    img: '/browser-frames/tablet-landscape-safari.webp',
    w: 1024, h: 768,
    chromeTop: 78, chromeBottom: 0,
    scale: 0.75,
    label: 'Safari · finestra 1024x690'
  },
  'tablet-portrait': {
    img: '/browser-frames/tablet-portrait-safari.webp',
    w: 768, h: 1024,
    chromeTop: 72, chromeBottom: 0,
    scale: 0.65,
    label: 'Safari · finestra 768x952'
  },
  'mobile-portrait': {
    img: '/browser-frames/mobile-portrait-safari.webp',
    w: 390, h: 844,
    chromeTop: 88, chromeBottom: 44,
    scale: 0.85,
    label: 'Safari · finestra 390x712'
  },
  'mobile-landscape': {
    img: '/browser-frames/mobile-landscape-safari.webp',
    w: 844, h: 390,
    chromeTop: 50, chromeBottom: 0,
    scale: 0.75,
    label: 'Safari · finestra 844x340'
  },
  'pwa': {
    img: '/browser-frames/pwa-standalone.webp',
    w: 390, h: 844,
    chromeTop: 14, chromeBottom: 0,
    scale: 0.85,
    label: 'PWA · finestra 390x830'
  },
};

// La pagina que es carrega a dins. Es pot canviar amb `?ruta=/nova/inici`.
const RUTA = (() => {
  const sp = new URLSearchParams(window.location.search);
  const r = (sp.get('ruta') || '/').trim();
  return r.startsWith('/') ? r : '/' + r;
})();

const ELS_NOMS = {
  'desktop': 'Escriptori',
  'desktop-1440': 'Portàtil 1440',
  'desktop-1366': 'Portàtil 1366',
  'desktop-1280': 'Portàtil 1280',
  'tablet-landscape': 'Tauleta apaïsada',
  'tablet-portrait': 'Tauleta vertical',
  'mobile-portrait': 'Mòbil vertical',
  'mobile-landscape': 'Mòbil apaïsat',
  'pwa': 'PWA',
};

const stage = document.getElementById('stage');
const tabs = document.getElementById('tabs');
const info = document.getElementById('info');
const escala1 = document.getElementById('escala1');

let overlayVisible = true;
/**
 * L'ESCALA ES RECORDA ENTRE REFRESCOS.
 *
 * Es una preferencia de treball, no un estat de la sessio: qui treballa a mida
 * real hi treballa tota l'estona, i haver-la de tornar a marcar a cada
 * recarrega es una molestia. Es desa al `localStorage` del propi overlay (es
 * una pagina de `/public`, no te res a veure amb l'aplicacio).
 */
const CLAU_ESCALA = 'hg-overlay-escala-1a1';
const escalaDesada = (() => {
  try { return localStorage.getItem(CLAU_ESCALA) === '1'; } catch { return false; }
})();
let escalaUn = escalaDesada;
escala1.checked = escalaDesada;

let actiu = 'desktop';
/** Els marcs ja muntats: `clau -> { el, iframe, overlay, top, bottom }`. */
const muntats = new Map();

/** Posa el marc d'un format a la mida que toca, amb l'escala d'ara. */
function aplicaMida(clau) {
  const fmt = FORMATS[clau];
  const m = muntats.get(clau);
  if (!m) return;
  const s = escalaUn ? 1 : fmt.scale;
  const dw = fmt.w * s;
  const dh = fmt.h * s;
  const ct = fmt.chromeTop * s;
  const cb = fmt.chromeBottom * s;
  const vpH = fmt.h - fmt.chromeTop - fmt.chromeBottom;

  m.el.style.width = dw + 'px';
  m.el.style.height = dh + 'px';

  // L'iframe es renderitza a la mida REAL del dispositiu i s'escala amb un
  // `transform`, amb l'origen a dalt a l'esquerra, i se'l desplaça cap avall
  // els pixels de la barra perque quedi just sota seu.
  m.iframe.style.position = 'absolute';
  m.iframe.style.top = '0';
  m.iframe.style.left = '0';
  m.iframe.style.width = fmt.w + 'px';
  m.iframe.style.height = vpH + 'px';
  m.iframe.style.transformOrigin = '0 0';
  m.iframe.style.transform = `scale(${s})`;
  m.iframe.style.marginTop = ct + 'px';

  m.overlay.style.width = dw + 'px';
  m.overlay.style.height = dh + 'px';
  m.overlay.style.display = overlayVisible ? 'block' : 'none';

  m.top.style.top = ct + 'px';
  m.top.style.display = overlayVisible ? 'block' : 'none';
  m.bottom.style.bottom = cb + 'px';
  m.bottom.style.display = (overlayVisible && cb > 0) ? 'block' : 'none';
}

/** Munta el marc d'un format, si no ho era ja. */
function muntat(clau) {
  if (muntats.has(clau)) return muntats.get(clau);
  const fmt = FORMATS[clau];

  const el = document.createElement('div');
  el.className = 'device-frame';
  el.dataset.format = clau;

  const iframe = document.createElement('iframe');
  iframe.src = RUTA;
  iframe.title = ELS_NOMS[clau] || clau;

  const overlay = document.createElement('img');
  overlay.className = 'browser-overlay';
  overlay.src = fmt.img;
  overlay.alt = '';

  const top = document.createElement('div');
  top.className = 'viewport-marker red-line';
  const bottom = document.createElement('div');
  bottom.className = 'viewport-marker bottom red-line';

  const carregant = document.createElement('div');
  carregant.className = 'carregant';
  carregant.textContent = `Carregant ${ELS_NOMS[clau] || clau}…`;

  el.append(iframe, overlay, top, bottom, carregant);
  stage.append(el);

  // `load` s'ha de tornar a armar a cada recarrega, i per aixo no el posem
  // nomes un cop: el recarregar del toolbar torna a deixar el marc en blanc.
  iframe.addEventListener('load', () => el.classList.add('carregat'));
  el.classList.remove('carregat');

  const m = { el, iframe, overlay, top, bottom };
  muntats.set(clau, m);
  aplicaMida(clau);
  return m;
}

/** Amaga el marc d'un format sense desmuntar-lo (es queda carregat). */
function amaga(clau) {
  const m = muntats.get(clau);
  if (m) m.el.style.display = 'none';
}

/** Ensenya un format, muntant-lo si cal. Els altres es queden carregats. */
function mostra(clau) {
  for (const k of muntats.keys()) if (k !== clau) amaga(k);
  const m = muntat(clau);
  m.el.style.display = 'block';
  actiu = clau;
  for (const b of tabs.querySelectorAll('button')) b.classList.toggle('actiu', b.dataset.format === clau);
  const fmt = FORMATS[clau];
  const s = escalaUn ? 1 : fmt.scale;
  info.textContent = `${fmt.label} · ${escalaUn ? 'a mida real (1:1)' : `escalat ×${s}`} · ${RUTA}`;
  stage.scrollTo(0, 0);
}

// LES PESTANYES, una per format.
for (const clau of Object.keys(FORMATS)) {
  const b = document.createElement('button');
  b.dataset.format = clau;
  b.innerHTML = `${ELS_NOMS[clau] || clau}<span class="mida">${FORMATS[clau].w}×${FORMATS[clau].h}</span>`;
  b.addEventListener('click', () => mostra(clau));
  tabs.append(b);
}

// ELS BOTONS.
document.getElementById('reload').addEventListener('click', () => {
  const m = muntats.get(actiu);
  // Recarrega NOMES la pestanya activa: les altres es queden com estan.
  if (!m) return;
  m.el.classList.remove('carregat');
  m.iframe.src = m.iframe.src;
});
document.getElementById('toggle-overlay').addEventListener('click', () => {
  overlayVisible = !overlayVisible;
  for (const clau of muntats.keys()) aplicaMida(clau);
});
escala1.addEventListener('change', (e) => {
  escalaUn = e.target.checked;
  try { localStorage.setItem(CLAU_ESCALA, escalaUn ? '1' : '0'); } catch { /* ignore */ }
  // L'escala val per a TOTES les pestanyes: canviar-la no ha de fer que unes
  // quantes quedin a una mida i les altres a una altra.
  for (const clau of muntats.keys()) aplicaMida(clau);
  mostra(actiu);
});

mostra(actiu);
</script>

</body>
</html>
